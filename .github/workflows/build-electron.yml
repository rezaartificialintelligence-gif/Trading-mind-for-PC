name: Build TraderMind Web App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # The lockfile is generated on Linux (Replit) so Windows-native optional
      # packages (rollup-win32, lightningcss-win32, etc.) are all marked as
      # skipped ('-'). Deleting it forces pnpm to resolve fresh on Windows and
      # install the correct platform binaries automatically.
      - name: Delete lockfile so pnpm resolves for Windows
        run: Remove-Item pnpm-lock.yaml -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Vite)
        run: pnpm --filter @workspace/tradermind run build
        env:
          NODE_ENV: production

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Web-Build
          path: artifacts/tradermind/dist/
          if-no-files-found: error
