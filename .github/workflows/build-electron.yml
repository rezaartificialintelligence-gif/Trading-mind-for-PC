name: Build TraderMind Electron App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Vite)
        run: pnpm --filter @workspace/tradermind run build
        env:
          NODE_ENV: production

      - name: Build Electron Windows installer
        run: pnpm --filter @workspace/tradermind run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Windows-Installer
          path: |
            artifacts/tradermind/dist-electron/*.exe
            artifacts/tradermind/dist-electron/*.msi
          if-no-files-found: warn

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Vite)
        run: pnpm --filter @workspace/tradermind run build
        env:
          NODE_ENV: production

      - name: Build Electron Mac app
        run: pnpm --filter @workspace/tradermind run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Mac-DMG
          path: |
            artifacts/tradermind/dist-electron/*.dmg
            artifacts/tradermind/dist-electron/*.zip
          if-no-files-found: warn
