name: Build TraderMind Web App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Fix: pnpm on Linux generates a lockfile that skips Windows-native
      # rollup binaries (@rollup/rollup-win32-x64-msvc). We install it
      # explicitly so Vite can build on the Windows runner.
      - name: Install Windows native rollup binary
        run: pnpm add @rollup/rollup-win32-x64-msvc --ignore-workspace-root-check
        working-directory: artifacts/tradermind

      - name: Build web app (Vite)
        run: pnpm --filter @workspace/tradermind run build
        env:
          NODE_ENV: production

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Web-Build
          path: artifacts/tradermind/dist/
          if-no-files-found: error
